<!-- Booking Form Section -->
<section class="bg-white py-8 px-6">
  <div class="max-w-7xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-8 -mt-20 relative z-10">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Pick-Up -->
        <div class="border-r md:border-r border-gray-200 pr-8">
          <div class="flex items-center mb-6">
            <input type="radio" id="pickup" name="trip" checked class="mr-3" />
            <label for="pickup" class="font-semibold text-lg">Pick-Up</label>
          </div>

          <div class="grid grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-2">Locations</label>
              <select class="w-full border border-gray-300 rounded p-2 text-sm">
                <option>Select your city</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2">Date</label>
              <select class="w-full border border-gray-300 rounded p-2 text-sm">
                <option>Select your date</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2">Time</label>
              <select class="w-full border border-gray-300 rounded p-2 text-sm">
                <option>Select your time</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Drop-Off -->
        <div class="pl-8">
          <div class="flex items-center mb-6">
            <input type="radio" id="dropoff" name="trip" class="mr-3" />
            <label for="dropoff" class="font-semibold text-lg">Drop-Off</label>
          </div>

          <div class="grid grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-2">Locations</label>
              <select class="w-full border border-gray-300 rounded p-2 text-sm">
                <option>Select your city</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2">Date</label>
              <select class="w-full border border-gray-300 rounded p-2 text-sm">
                <option>Select your date</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2">Time</label>
              <select class="w-full border border-gray-300 rounded p-2 text-sm">
                <option>Select your time</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-6 flex justify-end">
        <button class="px-8 py-3 bg-gray-900 text-white font-semibold rounded hover:bg-gray-800">
          Search
        </button>
      </div>
    </div>
  </div>
</section>
